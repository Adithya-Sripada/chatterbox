username = "YOUR_NAME"

# Base model and LoRA adapter location.
model = "mlx-community/Qwen2.5-3B-Instruct-4bit"
adapter_path = "adapters"

# How much chat before each of your messages to use as context.
context_messages = 15
context_seconds = 90

# Chatters whose messages are ignored everywhere (case-insensitive).
bots = ["nightbot", "streamelements", "moobot", "fossabot", "streamlabs", "wizebot", "sery_bot", "soundalerts", "pokemoncommunitygame", "kofistreambot"]

# Context lines longer than this are dropped (copypasta walls).
max_context_chars = 300

# Your repeated identical messages within this many seconds count as spam and are dropped.
repeat_window_seconds = 30

# The test set (eval + blind test) comes from messages at least this many days old,
# so you're not just recognizing chats you remember.
test_min_age_days = 7

# Generation settings.
num_suggestions = 3
temperature = 0.8
max_tokens = 60
